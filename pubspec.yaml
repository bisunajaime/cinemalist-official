name: cinemalist
description: TheMovieDB API Build with Flutter

publish_to: 'none'

version: 2.0.0+200

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  http: ^1.2.1
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  youtube_player_flutter: ^9.0.3
  logger: ^2.2.0
  flutter_cache_manager: ^3.3.2
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  share_plus: ^9.0.0
  flutter_svg: ^2.0.10
  collection: ^1.18.0
  flutter_animate: ^4.5.0
  flutter_markdown: ^0.7.6

dependency_overrides:
  win32: ^5.10.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/tmdb/
